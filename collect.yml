name: Collect city-twin data

on:
  schedule:
    # Every 15 minutes. GitHub cron is UTC and best-effort (may be delayed
    # under load). 15 min keeps well within free API limits.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button for testing

# Prevent overlapping runs from racing on the CSV / git push
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the CSV back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python collector.py

      - name: Commit new data
        run: |
          git config user.name "city-twin-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: collection cycle $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "No new data this cycle (all stations skipped); nothing to commit."
          fi
