name: Collect city-twin data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python collector.py

      - name: Commit new data
        run: |
          git config user.name "city-twin-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: cycle $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "No new data this cycle; nothing to commit."
          fi
