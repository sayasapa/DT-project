name: Collect Kazakhstan Cities Air Data

on:
  schedule:
    - cron: '15,45 * * * *'   # every 30 min, offset from collect_ukg.yml (:00/:20/:40)
  workflow_dispatch:

jobs:
  collect_cities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run multi-city collector
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: python collector_multicity.py

      - name: Commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cities_air_data.csv data/cities_air_data_archive_*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: cities cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
